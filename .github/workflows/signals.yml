name: Обновление MacroScope

on:
  schedule:
    # 07:00 UTC = 10:00 МСК, каждый будний день
    - cron: "0 7 * * 1-5"
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install requests "python-telegram-bot==21.5"

      - name: Расчёт сигналов по стратегиям
        run: python publish_signals.py

      - name: Дополнение макроданных
        run: python macro_pull.py
        continue-on-error: true

      - name: Коммит результата
        run: |
          git config user.name "macroscope-bot"
          git config user.email "actions@github.com"
          git add signals.json state.json macro.json || true
          git diff --staged --quiet || git commit -m "Обновление на $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
